name: Bug Report
description: Report a reproducible problem in the package, CLI, notebooks, or serving stack.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for an offline reproduction when possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, config, or notebook cells that reproduce the issue.
      placeholder: |
        poetry install --with dev
        poetry run hf-lab ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, package version, and whether GPU/CUDA is involved.
      placeholder: |
        Python:
        OS:
        Package version or commit:
        GPU/CUDA:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Traceback
      render: text
