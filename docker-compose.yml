version: "3.9"

services:
  hf-lab-serve:
    build: .
    image: hf-finetuning-lab:latest
    container_name: hf-lab-serve
    environment:
      # Read by `hf-lab serve` through ServingConfig.from_env. The image
      # ships no model, so the bind-mount below supplies the artifact these
      # paths point at.
      HF_LAB_MODEL_DIR: "/models/support-triage"
      HF_LAB_MODEL_VERSION: "1.0.0"
      HF_LAB_ENABLE_METRICS: "false"
    ports:
      - "8000:8000"
    # The image ships no model. Mount a host directory holding a trained
    # artifact; HF_LAB_MODEL_DIR above points inside this mount.
    volumes:
      - ./artifacts/models:/models:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
