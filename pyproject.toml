[project]
name = "huggingface-finetuning-lab"
version = "1.1.0"
description = "Production-focused Hugging Face NLP fine-tuning lab with reproducible training, evaluation, PEFT/LoRA, serving, and model cards"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Diogo Ribeiro", email = "diogo_dj@hotmail.com" }]
keywords = [
  "hugging-face",
  "transformers",
  "nlp",
  "text-classification",
  "fine-tuning",
  "peft",
  "lora",
  "fastapi",
  "pytorch",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/DiogoRibeiro7/huggingface-finetuning-lab"
"Repository" = "https://github.com/DiogoRibeiro7/huggingface-finetuning-lab"
"Documentation" = "https://github.com/DiogoRibeiro7/huggingface-finetuning-lab/tree/main/docs"
"Bug Tracker" = "https://github.com/DiogoRibeiro7/huggingface-finetuning-lab/issues"
"Changelog" = "https://github.com/DiogoRibeiro7/huggingface-finetuning-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# poetry install --extras metrics
metrics = ["prometheus-client>=0.21.0,<0.22.0"]

[project.scripts]
hf-lab = "hf_finetuning_lab.cli:app"

[tool.poetry]
packages = [{ include = "hf_finetuning_lab", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.0"
numpy = "^2.4.6"
scikit-learn = "^1.4.0"
typer = { version = "^0.27.1", extras = ["all"] }
pyyaml = "^6.0.1"
matplotlib = "^3.8.0"
fastapi = "^0.141.0"
uvicorn = { version = "^0.52.3", extras = ["standard"] }
pydantic = "^2.7.0"
transformers = "^5.5.0"
datasets = "^5.0.0"
evaluate = "^0.4.6"
accelerate = "^1.1.0"
torch = "^2.13.0"
safetensors = "^0.8.0"
huggingface-hub = "^1.28.0"
peft = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.16.3"
mypy = "^2.3.1"
httpx = "^0.28.1"
pre-commit = "^4.2.0"
nbqa = "^1.9.1"
jupyter = "^1.1.1"
types-PyYAML = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = [
  ".git",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "__pycache__",
  "artifacts",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are excluded by default: they reach the Hugging Face Hub, so
# they are too slow and too flaky to gate a merge. The hub-presets workflow
# runs them on a schedule instead.
addopts = "-q -m 'not network'"
markers = [
  "network: reaches an external service; run with -m network",
]
